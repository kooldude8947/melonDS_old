name: melonDS Windows Static

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  MELONDS_GIT_BRANCH: ${{ github.ref }}
  MELONDS_GIT_HASH: ${{ github.sha }}
  MELONDS_BUILD_PROVIDER: GitHub Actions
  
jobs:
  build:
    runs-on: windows-2022
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
    steps:
      - uses: actions/checkout@v7
      - name: Download source code
        shell: cmd
        run: |
          git clone --revision=b86390e4428bf38ce4c1ce0e9ca446d6d25955e8 https://github.com/melonDS-emu/melonDS
          git clone https://github.com/${{ github.repository_owner }}/Qt-Win-Static
          
      - name: Restore vcpkg cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/melonDS/vcpkg_cache
          key: vcpkg-x86_64-windows-${{ hashFiles('${{ github.workspace }}/melonDS/vcpkg.json') }}
          restore-keys: vcpkg-x86_64-windows-
          
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '9b965a116838c6cdcd36bca60d1b81b030c8ab8d'
          vcpkgDirectory: ${{ github.workspace }}\melonDS\vcpkg
          vcpkgJsonGlob: ${{ github.workspace }}\melonDS\vcpkg.json
          
      - name: Build
        uses: lukka/run-cmake@v10
        with:
          cmakeListsTxtPath: ${{ github.workspace }}\melonDS\CMakeLists.txt
          configurePreset: release
          configurePresetAdditionalArgs: "['-DENABLE_DEBUG_DEPS=OFF', '-DMELONDS_EMBED_BUILD_INFO=ON']"
          buildPreset: release-windows-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: melonDS-windows-x86_64
          path: ${{ github.workspace }}\melonDS\build\release-windows-x86_64\melonDS.exe
          
      - name: Save vcpkg cache
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-x86_64-windows-${{ hashFiles('${{ github.workspace }}/melonDS/vcpkg.json') }}
