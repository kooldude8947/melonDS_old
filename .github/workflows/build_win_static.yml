name: melonDS Windows Static

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
   libarchive_version: 3.5.0
   
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7          
      - name: Install dependencies
        run: |
          vcpkg install libarchive:x64-mingw-static-release --overlay-triplets ${{github.workspace}}
          
      - name: Install dependencies again
        run: |
          mkdir external_libs
          $AllProtocols = [System.Net.SecurityProtocolType]'Tls,Tls11,Tls12'
          [System.Net.ServicePointManager]::SecurityProtocol = $AllProtocols
          $ProgressPreference = 'SilentlyContinue'
          
          $libarchive_archive_file = "${{ github.workspace }}\external_libs\libarchive-v${{ env.libarchive_version }}-win64.zip"
          Invoke-WebRequest -Uri https://github.com/libarchive/libarchive/releases/download/v${{ env.libarchive_version }}/libarchive-v${{ env.libarchive_version }}-win64.zip -OutFile $libarchive_archive_file

      - name: Pacman cmd
        run: pacman --noconfirm -S mingw-w64-ucrt-x86_64-{SDL2,libarchive,enet,zstd,faad2}

      - name: Install Visual Studio platform toolset v141
        shell: cmd
        run: |
          "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\setup.exe" modify --quiet --norestart --includeRecommended --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" --channelId VisualStudio.15.Release --add Microsoft.VisualStudio.Component.VC.v141.x86.x64
          
      - name: Download source code
        shell: cmd
        run: |
          git clone https://github.com/melonDS-emu/melonDS
          git clone https://github.com/${{ github.repository_owner }}/Qt-Win-Static

      - name: Copy modified source code to original folders
        shell: cmd
        run: xcopy /q /s /x /y ${{ github.workspace }}\newsrc ${{ github.workspace }}\melonDS

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: 14.16
      - name: Build
        working-directory: ${{ github.workspace }}\melonDS
        shell: cmd
        run: |
          mkdir build
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_STATIC=ON -DUSE_QT6=OFF -DENABLE_GDBSTUB=OFF -DENABLE_DEBUG_DEPS=OFF ^
          -DQt5_DIR=${{ github.workspace }}\Qt-Win-Static\Qt\Qt-5.15.19\lib\cmake\Qt5 -G "Visual Studio 17 2022" -DCMAKE_PREFIX_PATH=${{ github.workspace }}\external_libs
          cmake --build build
          
      - name: List dir
        shell: cmd
        run: dir "${{ github.workspace }}\melonDS\build"
