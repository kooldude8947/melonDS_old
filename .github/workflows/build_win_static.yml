name: melonDS Windows Static

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
   libarchive_version: 3.6.2
   
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7          
      - name: Install dependencies
        run: |
          vcpkg install enet faad2 libarchive sdl2 zstd:x64-mingw-static-release --overlay-triplets ${{github.workspace}} --overlay-ports ${{github.workspace}}\ports
          choco install pkgconfiglite
          
      - name: Download source code
        shell: cmd
        run: |
          git clone https://github.com/melonDS-emu/melonDS
          git clone https://github.com/${{ github.repository_owner }}/Qt-Win-Static

      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        working-directory: ${{ github.workspace }}\melonDS
        shell: cmd
        run: |
          mkdir build
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_STATIC=ON -DUSE_QT6=OFF -DENABLE_GDBSTUB=OFF -DENABLE_DEBUG_DEPS=OFF ^
          -DQt5_DIR=${{ github.workspace }}\Qt-Win-Static\Qt\Qt-5.15.19\lib\cmake\Qt5 ^
          -G "MSYS Makefiles"
          cmake --build build
          
      - name: List dir
        shell: cmd
        run: dir /S "${{ github.workspace }}\melonDS\build"
