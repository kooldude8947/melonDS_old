name: melonDS Windows Static

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
   
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          suppress-deprecation-warnings: msystem-mingw64
          update: false
          
      - name: Install dependencies
        shell: msys2 {0}
        run: pacman --noconfirm -S mingw-w64-x86_64-{toolchain,SDL2,libarchive,zstd,faad2} mingw-w64-clang-x86_64-enet
        
      - name: Download source code
        shell: cmd
        run: |
          git clone --revision=b86390e4428bf38ce4c1ce0e9ca446d6d25955e8 https://github.com/melonDS-emu/melonDS
          git clone https://github.com/${{ github.repository_owner }}/Qt-Win-Static

      - name: Copy modified source code to original folders
        shell: cmd
        run: xcopy /q /s /x /y ${{ github.workspace }}\newsrc ${{ github.workspace }}\melonDS

      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        working-directory: ${{ github.workspace }}\melonDS
        shell: cmd
        env:
          LLVM_DIR: "C:/Program Files/LLVM/bin"
        run: |
          mkdir build
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_STATIC=ON -DUSE_QT6=OFF -DQt5_DIR=${{ github.workspace }}\Qt-Win-Static\Qt\Qt-5.15.19\lib\cmake\Qt5 -DENABLE_GDBSTUB=OFF ^
          -G "Visual Studio 17 2022" -T ClangCL -A x64 -DCMAKE_PREFIX_PATH=D:\a\_temp\msys64\mingw64
          cmake --build build
          
      - name: List dir
        shell: cmd
        run: dir "${{ github.workspace }}\melonDS\build"
