name: melonDS Windows Static

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: false

      - name: List Clang
        shell: cmd
        run: |
          echo "Dir 1..."
          dir /S "C:/Program Files (x86)/LLVM"
          echo "Dir 2..."
          dir /S "C:\Program Files\LLVM"
          
      - name: Install dependencies
        shell: msys2 {0}
        run: pacmana --noconfirm -S mingw-w64-ucrt-x86_64-{toolchain,SDL2,libarchive,enet,zstd,faad2}
        
      - name: Download source code
        shell: cmd
        run: |
          git clone --revision=b86390e4428bf38ce4c1ce0e9ca446d6d25955e8 https://github.com/melonDS-emu/melonDS
          git clone https://github.com/${{ github.repository_owner }}/Qt-Win-Static

      - name: Copy modified source code to original folders
        shell: cmd
        run: xcopy /q /s /x /y ${{ github.workspace }}\newsrc ${{ github.workspace }}\melonDS
        
      - name: Build
        working-directory: ${{ github.workspace }}\melonDS
        shell: cmd
        env:
          CMAKE_C_COMPILER: "clang.exe"
          CMAKE_CXX_COMPILER: "clang++.exe"
          CMAKE_RC_COMPILER: "llvm-rc.exe"
        run: |
          mkdir build
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_STATIC=ON -DUSE_QT6=OFF -DQt5_DIR=${{ github.workspace }}\Qt-Win-Static\Qt\Qt-5.15.19\lib\cmake\Qt5 -DENABLE_GDBSTUB=OFF -DCMAKE_PREFIX_PATH=D:\a\_temp\msys64\ucrt64
          cmake --build build
          
      - name: List dir
        shell: cmd
        run: dir "${{ github.workspace }}\melonDS\build"
