name: Build Windows MSVC

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  triplet: x64-windows-msvc-static
  openssl_location: C:\Program Files\OpenSSL
  sevenzip_location: C:\Program Files\7-Zip
  
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          sdk: 6.1.7601
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Install dependencies
        shell: cmd
        run: |
          git clone https://github.com/microsoft/vcpkg
          cd vcpkg
          copy /y /v ${{github.workspace}}\${{ env.triplet }}.cmake triplets
          vcpkg install dirent:${{env.triplet}}
          vcpkg install enet:${{env.triplet}}
          vcpkg install faad2:${{env.triplet}}
          vcpkg install libarchive:${{env.triplet}}
          vcpkg install sdl2:${{env.triplet}}
