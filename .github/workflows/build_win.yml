name: Build Windows MSVC

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  triplet: x64-windows-static-md-release
  
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Install dependencies
        env:
          libarchive_version: 253b8aa8478061c9b26f168c9e1a6e2fe5f87766
        working-directory: C:\vcpkg
        shell: cmd
        run: |
          choco install pkgconfiglite
          git checkout ${{env.libarchive_version}} -- ports/libarchive
          vcpkg install libarchive:${{ env.triplet }}
          vcpkg install dirent:${{env.triplet}}
          vcpkg install enet:${{env.triplet}}
          vcpkg install faad2:${{env.triplet}}
          vcpkg install pkgconf:${{env.triplet}}
          vcpkg install sdl2:${{env.triplet}}
          vcpkg install zstd:${{env.triplet}}

      - name: Download source code
        shell: cmd
        env:
          melonDS_commit: 906e9ebb27da8c6a715cd7abab4abfe8a8d29427
        run: |
          git clone --revision ${{env.melonDS_commit}} https://github.com/melonDS-emu/melonDS
          git clone https://github.com/${{ github.repository_owner }}/Qt-Win-Static

      - name: Copy modified source code to original folders
        shell: cmd
        run: xcopy /h /q /s /x /y ${{ github.workspace }}\newsrc ${{ github.workspace }}\melonDS

      - name: Build
        working-directory: ${{github.workspace}}\melonDS
        shell: cmd
        run: |
          mkdir build
          cmake -S . -B build -T ClangCL -A x64 ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_C_COMPILER=clang.exe ^
          -DCMAKE_CXX_COMPILER=clang++.exe ^
          -DCMAKE_RC_COMPILER=llvm-rc.exe ^
          -DENABLE_DEBUG_DEPS=OFF ^
          -DMELONDS_EMBED_BUILD_INFO=OFF ^
          -DENABLE_GDBSTUB=OFF ^
          -DBUILD_STATIC=ON ^
          -DUSE_QT6=OFF ^
          -DQt5_DIR=${{github.workspace}}\Qt-Win-Static\Qt\Qt-5.15.19\lib\cmake\Qt5 ^
          -DCMAKE_PREFIX_PATH=C:\vcpkg\installed\${{env.triplet}}
          cmake --build build
