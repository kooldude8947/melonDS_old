name: Test CMake

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  triplet: x64-windows-msvc-static
  
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        
      - name: Compile
        shell: cmd
        run: |
          mkdir build
          dir /S "C:\Program Files\LLVM"
          cmake -S . -B build -DCMAKE_SYSTEM_VERSION=6.1.7601 -G Ninja -DCMAKE_CXX_COMPILER=clang++.exe
